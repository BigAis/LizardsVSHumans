<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Project Allecc</title>
    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/404.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/3d-effects.css">
</head>
<body>
    <div class="error-container">
        <div class="error-bg"></div>
        <div class="particles" id="particles"></div>
        
        <div class="error-content">
            <img src="images/characters/lizard-character.png" alt="Lizard Character" class="game-character float-effect">
            
            <div class="error-code text-3d">404</div>
            <h1 class="error-title fade-in-up">Page Not Found</h1>
            <p class="error-message fade-in-up delay-200">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Don't worry, even our Lizards get lost sometimes.</p>
            
            <div class="search-box fade-in-up delay-300">
                <input type="text" placeholder="Search our website..." class="input-focus-effect">
                <button class="btn-3d"><i class="fas fa-search"></i></button>
            </div>
            
            <div class="error-nav fade-in-up delay-400">
                <a href="index.html" class="float-effect"><i class="fas fa-home"></i> Home</a>
                <a href="games.html" class="float-effect"><i class="fas fa-gamepad"></i> Games</a>
                <a href="documentation.html" class="float-effect"><i class="fas fa-book"></i> Documentation</a>
                <a href="contact.html" class="float-effect"><i class="fas fa-envelope"></i> Contact</a>
            </div>
            
            <div class="error-buttons fade-in-up delay-500">
                <a href="index.html" class="btn btn-primary btn-3d pulse-effect">Back to Home</a>
            </div>
            
            <div class="error-footer fade-in-up delay-600">
                <p>© 2025 Project Allecc. All Rights Reserved.</p>
            </div>
        </div>
    </div>
    
    <!-- Add this style for input focus effects -->
    <style>
        .input-focus-effect {
            transition: all 0.3s ease;
            border: 1px solid #eee;
        }
        
        .input-focus-effect:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(106, 13, 173, 0.2);
            transform: translateY(-2px);
        }
        
        /* Enhanced particles */
        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(106, 13, 173, 0.5); }
            50% { box-shadow: 0 0 20px rgba(106, 13, 173, 0.8), 0 0 30px rgba(48, 207, 208, 0.4); }
            100% { box-shadow: 0 0 5px rgba(106, 13, 173, 0.5); }
        }
        
        .particle {
            animation: particleFloat 15s infinite, glow 3s infinite !important;
        }
        
        /* Enhanced character animation */
        @keyframes floatCharacter {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(-5deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        
        .game-character {
            animation: floatCharacter 6s infinite ease-in-out !important;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.3));
        }
        
        /* Error code animation */
        @keyframes glitchText {
            0% { text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.05em -0.025em 0 rgba(0, 255, 0, 0.75), 0.025em 0.05em 0 rgba(0, 0, 255, 0.75); }
            14% { text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.05em -0.025em 0 rgba(0, 255, 0, 0.75), 0.025em 0.05em 0 rgba(0, 0, 255, 0.75); }
            15% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.75), 0.025em 0.025em 0 rgba(0, 255, 0, 0.75), -0.05em -0.05em 0 rgba(0, 0, 255, 0.75); }
            49% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.75), 0.025em 0.025em 0 rgba(0, 255, 0, 0.75), -0.05em -0.05em 0 rgba(0, 0, 255, 0.75); }
            50% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.75), 0.05em 0 0 rgba(0, 255, 0, 0.75), 0 -0.05em 0 rgba(0, 0, 255, 0.75); }
            99% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.75), 0.05em 0 0 rgba(0, 255, 0, 0.75), 0 -0.05em 0 rgba(0, 0, 255, 0.75); }
            100% { text-shadow: -0.025em 0 0 rgba(255, 0, 0, 0.75), -0.025em -0.025em 0 rgba(0, 255, 0, 0.75), -0.025em -0.05em 0 rgba(0, 0, 255, 0.75); }
        }
        
        .error-code {
            animation: glitchText 0.5s infinite;
            position: relative;
        }
        
        .error-code::before,
        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .error-code::before {
            animation: glitchText 0.5s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translate(-0.025em, -0.0125em);
            opacity: 0.8;
        }
        
        .error-code::after {
            animation: glitchText 0.5s infinite;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            transform: translate(0.025em, 0.0125em);
            opacity: 0.8;
        }
    </style>
    
    <script>
        // Create enhanced floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50; // Increased count
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random size
            const size = Math.random() * 8 + 2; // Larger particles
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // Random position
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            particle.style.left = `${posX}%`;
            particle.style.top = `${posY}%`;
            
            // Random opacity
            particle.style.opacity = Math.random() * 0.7 + 0.3;
            
            // Random animation duration and delay
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * 5;
            particle.style.animation = `particleFloat ${duration}s ${delay}s infinite, glow 3s infinite`;
            
            // Random color
            const hue = Math.floor(Math.random() * 60) + 260; // Purple to blue range
            particle.style.backgroundColor = `hsla(${hue}, 100%, 70%, 0.8)`;
            particle.style.borderRadius = '50%';
            
            particlesContainer.appendChild(particle);
        }
        
        // Search functionality
        document.querySelector('.search-box').addEventListener('submit', function(e) {
            e.preventDefault();
            const searchTerm = document.querySelector('.search-box input').value;
            
            // In a real implementation, this would redirect to search results
            // For now, just go to home page
            window.location.href = 'index.html';
        });
        
        // Make search box button work
        document.querySelector('.search-box button').addEventListener('click', function() {
            document.querySelector('.search-box').dispatchEvent(new Event('submit'));
        });
        
        // Add random movement to character
        const character = document.querySelector('.game-character');
        setInterval(() => {
            const randomX = (Math.random() - 0.5) * 10;
            character.style.transform = `translateX(${randomX}px)`;
        }, 2000);
        
        // Error code glitch effect
        const errorCode = document.querySelector('.error-code');
        setInterval(() => {
            const randomColor = `rgba(${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, 0.5)`;
            errorCode.style.textShadow = `0 0 10px ${randomColor}, 0 0 20px ${randomColor}, 0 0 30px ${randomColor}`;
        }, 100);
    </script>
</body>
</html>
